name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm lint
      # D-132: correctness suite, all cores; wall-clock limits are report-only here (the perf job asserts them)
      - run: pnpm test
      - run: pnpm build
      - run: pnpm shots ci --assert --no-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-ci
          path: shots/ci
          if-no-files-found: ignore

  # D-132: wall-clock limits on a quiet runner of its own, one worker, calibrated to the runner's speed
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # D-134: report-only until TASK-553 wins back generation time (runner reads ~1.3-1.6x the scaled bound)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:perf

  # TASK-607 (D-185): the wow set at high quality against BUDGETS.high, report-only (SwiftShader).
  # Representative subset (full set = 61 frames, ~20 min on a laptop): tightest memory (W8, both
  # night frames at 29 programs), calls (W16, W-horseshoe-quay), sky / god rays (W-sky-dusk), W1.
  wow-high:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm shots wow-high --assert --no-selftest --only=W1,W8,W16,W-ember-lane-night,W-fairy-night,W-horseshoe-quay,W-sky-dusk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-wow-high
          path: shots/wow-high
          if-no-files-found: ignore
